        case 'link':

          );
        case 'refresh':
          return (

              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
              <path d="M8 16H3v5" />

          );
        case 'user':
          return (
            <svg {...props}>
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />

          );
        case 'camera':
          return (
            <svg {...props}>
              <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
              <circle cx="12" cy="13" r="3" />

          );
        case 'chevronLeft':
          return (

              <polyline points="15 18 9 12 15 6" />

          );
        case 'chevronRight':
          return (

              <polyline points="9 18 15 12 9 6" />

          );
        case 'eyeOff':
          return (

              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />

              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />

          );

          );
        case 'graduation':
          return (

              <path d="M22 10v6M2 10l10-5 10 5-10 5z" />

          return null;
      }
    }

    // Kategorie zajęć dydaktycznych (wykluczone ze Wspólnej Osi Czasu, wyświetlane w zakładce Kalendarz)
    const CLASS_CATEGORIES = ['WYKLAD', 'LAB', 'LEKTORAT', 'CWICZENIA', 'PROJEKT'];
    // Kategorie terminów ważnych (wyświetlane na Wspólnej Osi Czasu na Dashboardzie)
    const TIMELINE_ONLY_CATEGORIES = ['KOLOKWIUM', 'EGZAMIN', 'DEADLINE_RAU2', 'INNE'];

    async function apiFetch(url, options = {}) {
      const config = {
        credentials: 'include',
        headers: {
          ...(options.body instanceof FormData ? {} : { 'Content-Type': 'application/json' }),
          ...(options.headers || {})
        },
        ...options
      };
      const response = await fetch(url, config);
      if (!response.ok) {
        let errMessage = `Błąd HTTP ${response.status}`;
        try {
          const errData = await response.json();
          errMessage = errData.detail || errData.message || errMessage;
        } catch (_) {}
        const error = new Error(errMessage);
        error.status = response.status;
        throw error;
      }
      const contentType = response.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        return await response.json();
      }
      return response;
    }

    function formatDateTime(dtStr) {
      if (!dtStr) return '—';
      const d = new Date(dtStr);
      return d.toLocaleString('pl-PL', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function formatTimeShort(dtStr) {
      if (!dtStr) return '';
      const d = new Date(dtStr);
      return d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
    }

    function getInitials(name) {
      if (!name) return 'SR';
      return name
        .split(' ')
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part[0].toUpperCase())
        .join('');
    }

    function CategoryBadge({ category }) {
      const map = {
        KOLOKWIUM: 'bg-amber-500/20 text-amber-300 border-amber-500/40',
        EGZAMIN: 'bg-rose-500/20 text-rose-300 border-rose-500/40',
        DEADLINE_RAU2: 'bg-purple-500/20 text-purple-300 border-purple-500/40',
        LAB: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
        WYKLAD: 'bg-sky-500/20 text-sky-300 border-sky-500/40',
        LEKTORAT: 'bg-teal-500/20 text-teal-300 border-teal-500/40',
        CWICZENIA: 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40',
        PROJEKT: 'bg-indigo-500/20 text-indigo-300 border-indigo-500/40',
        INNE: 'bg-slate-700/50 text-slate-300 border-slate-600'
      };
      const cls = map[category] || map.INNE;
      return (
        <span className={`text-[11px] font-semibold px-2.5 py-0.5 rounded-full border ${cls}`}>
          {category}
        </span>
      );
    }

    function RoleBadge({ role }) {
      const styles = {
        ADMIN: 'bg-indigo-500/20 text-indigo-300 border-indigo-500/40',
        GROUP_LEADER: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40',
        VIEWER: 'bg-slate-700/60 text-slate-300 border-slate-600'
      };
      const labels = {
        ADMIN: 'ADMIN (Starosta Roku)',
        GROUP_LEADER: 'GROUP_LEADER (Starosta Grupy)',
        VIEWER: 'VIEWER (Tylko odczyt)'
      };
      return (
        <span className={`text-xs font-medium px-2.5 py-0.5 rounded-full border ${styles[role] || styles.VIEWER}`}>
          {labels[role] || role}
        </span>
      );
    }

    // ==================== MODAL PROFILU I ZDJĘCIA PROFILOWEGO ====================
    function ProfileModal({ isOpen, onClose, user, onUserUpdated, showToast }) {
      const [uploading, setUploading] = useState(false);
      const [passwords, setPasswords] = useState({ current_password: '', new_password: '' });
      const [changingPass, setChangingPass] = useState(false);

      if (!isOpen || !user) return null;

      const handleAvatarChange = async (file) => {
        if (!file) return;
        setUploading(true);
        const formData = new FormData();
        formData.append('file', file);
        try {
          const updatedUser = await apiFetch('/api/auth/avatar', {
            method: 'POST',
            body: formData
          });
          onUserUpdated(updatedUser);
          showToast('Zdjęcie profilowe zostało zaktualizowane.');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setUploading(false);
        }
      };

      const handleRemoveAvatar = async () => {
        setUploading(true);
        try {
          const updatedUser = await apiFetch('/api/auth/avatar', { method: 'DELETE' });
          onUserUpdated(updatedUser);
          showToast('Zdjęcie profilowe zostało usunięte.');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setUploading(false);
        }
      };

      const handleChangePassword = async (e) => {
        e.preventDefault();
        setChangingPass(true);
        try {
          await apiFetch('/api/auth/change-password', {
            method: 'POST',
            body: JSON.stringify(passwords)
          });
          setPasswords({ current_password: '', new_password: '' });
          showToast('Hasło do konta zostało zmienione.');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setChangingPass(false);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4">
          <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
            <div className="px-6 py-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <Icon name="user" className="w-4 h-4 text-blue-400" />
                <h3 className="text-sm font-bold text-white">Twój Profil i Zdjęcie Profilowe</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                <Icon name="close" className="w-4 h-4" />
              </button>
            </div>

            <div className="p-6 space-y-6">
              {/* Sekcja Zdjęcia Profilowego */}
              <div className="flex items-center gap-5">
                <div className="relative group">
                  {user.avatar_url ? (
                    <img
                      src={user.avatar_url}
                      alt={user.full_name}
                      className="w-20 h-20 rounded-full object-cover border-2 border-blue-500 shadow-lg"
                    />
                  ) : (
                    <div className="w-20 h-20 rounded-full bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-xl font-bold text-white border-2 border-slate-700 shadow-lg">
                      {getInitials(user.full_name)}
                    </div>
                  )}
                  <label className="absolute inset-0 rounded-full bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center cursor-pointer transition">
                    <Icon name="camera" className="w-6 h-6 text-white" />
                    <input
                      type="file"
                      accept="image/png,image/jpeg,image/webp,image/gif"
                      className="hidden"
                      onChange={(e) => e.target.files?.[0] && handleAvatarChange(e.target.files[0])}
                    />
                  </label>
                </div>

                <div className="space-y-2 flex-1">
                  <div>
                    <div className="text-sm font-bold text-white">{user.full_name}</div>
                    <div className="text-xs text-slate-400 font-mono">{user.email}</div>
                  </div>
                  <div className="flex flex-wrap items-center gap-2">
                    <label className="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white transition">
                      <Icon name="camera" className="w-3.5 h-3.5" />
                      <span>{uploading ? 'Wgrywanie...' : 'Wgraj zdjęcie'}</span>
                      <input
                        type="file"
                        accept="image/png,image/jpeg,image/webp,image/gif"
                        className="hidden"
                        disabled={uploading}
                        onChange={(e) => e.target.files?.[0] && handleAvatarChange(e.target.files[0])}
                      />
                    </label>
                    {user.avatar_url && (
                      <button
                        type="button"
                        onClick={handleRemoveAvatar}
                        disabled={uploading}
                        className="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-rose-500/15 hover:bg-rose-500/30 text-rose-300 text-xs font-semibold transition"
                      >
                        <Icon name="trash" className="w-3.5 h-3.5" />
                        <span>Usuń</span>
                      </button>
                    )}
                  </div>
                </div>
              </div>

              {/* Zmiana hasła */}
              <form onSubmit={handleChangePassword} className="pt-4 border-t border-slate-800 space-y-3">
                <h4 className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                  Zmiana hasła dostępowego
                </h4>
                <input
                  type="password"
                  required
                  placeholder="Aktualne hasło"
                  value={passwords.current_password}
                  onChange={(e) => setPasswords({ ...passwords, current_password: e.target.value })}
                  className="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-xs text-white"
                />
                <input
                  type="password"
                  required
                  minLength={6}
                  placeholder="Nowe hasło (min. 6 znaków)"
                  value={passwords.new_password}
                  onChange={(e) => setPasswords({ ...passwords, new_password: e.target.value })}
                  className="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-700 text-xs text-white"
                />
                <div className="flex justify-end gap-2 pt-1">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-3.5 py-1.5 rounded-lg bg-slate-800 text-xs font-semibold text-slate-300"
                  >
                    Zamknij
                  </button>
                  <button
                    type="submit"
                    disabled={changingPass}
                    className="px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold text-white"
                  >
                    {changingPass ? 'Zapisywanie...' : 'Zmień hasło'}
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ==================== WIDOK LOGOWANIA ====================
    function LoginView({ onLoginSuccess }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const user = await apiFetch('/api/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email, password })
          });
          onLoginSuccess(user);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center px-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-950/50 via-slate-950 to-slate-950">
          <div className="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl shadow-2xl p-8 backdrop-blur-md">
            <div className="flex items-center gap-3 mb-6">
              <div className="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center shadow-lg shadow-blue-600/30 font-bold text-xl tracking-wider">
                RAU2
              </div>
              <div>
                <h1 className="text-xl font-bold text-white tracking-tight">Starosta Hub</h1>
                <p className="text-xs text-slate-400">Politechnika Śląska • Wydział AEiI (RAU2)</p>
              </div>
            </div>

            <p className="text-sm text-slate-400 mb-6">
              Zaloguj się kontem Starosty Roku lub Starosty Grupy Dziekańskiej. Autoryzacja chroniona tokenem JWT (HttpOnly).
            </p>

            {error && (
              <div className="mb-4 p-3 rounded-lg bg-rose-500/15 border border-rose-500/40 text-rose-300 text-sm flex items-center gap-2">
                <Icon name="alert" className="w-4 h-4 shrink-0" />
                <span>{error}</span>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
                  Adres Email (@student.polsl.pl)
                </label>
                <input
                  type="email"
                  required
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  placeholder="starosta@student.polsl.pl"
                  className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-slate-100 focus:outline-none focus:border-blue-500 text-sm"
                />
              </div>

              <div>
                <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">
                  Hasło
                </label>
                <input
                  type="password"
                  required
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  placeholder="••••••••••••"
                  className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-slate-100 focus:outline-none focus:border-blue-500 text-sm"
                />
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 disabled:opacity-50 font-semibold text-sm text-white shadow-lg shadow-blue-600/25 transition"
              >
                {loading ? 'Weryfikacja poświadczeń...' : 'Zaloguj do Panelu Starosty'}
              </button>
            </form>

            <div className="mt-6 pt-5 border-t border-slate-800/80 text-xs text-slate-500 flex justify-between">
              <span>Integracja: USOSweb & Moodle RAU2</span>
              <span>Office 365 SMTP / BCC</span>
            </div>

    // ==================== MODAL WYSYŁKI MAILI (SMTP + 1-CLICK OUTLOOK FALLBACK) ====================
    function MailModal({ isOpen, onClose, recipients, selectedGroup, mailConfig, showToast }) {
      const [subject, setSubject] = useState('[RAU2] Komunikat Starosty Roku');
      const [bodyTemplate, setBodyTemplate] = useState(
        'Cześć {imie},\n\nPrzypominam o nadchodzącym terminie dla grupy {grupa}.\n\nPozdrawiam,\nStarosta Roku AEiI (RAU2)'
      );
      const [sending, setSending] = useState(false);
      const [result, setResult] = useState(null);

      if (!isOpen) return null;

      const sampleStudent = recipients[0] || {
        imie: 'Jan',
        nazwisko: 'Kowalski',
        email: 'jan.kowalski@student.polsl.pl',
        grupa: '1',
        komentarz: 'rozliczony'
      };

      const renderPreview = (tpl) => {
        return tpl
          .replaceAll('{imie}', sampleStudent.imie)
          .replaceAll('{nazwisko}', sampleStudent.nazwisko)
          .replaceAll('{email}', sampleStudent.email)
          .replaceAll('{grupa}', sampleStudent.grupa)
          .replaceAll('{komentarz}', sampleStudent.komentarz || '');
      };

      const handleSmtpSend = async (e) => {
        e.preventDefault();
        setSending(true);
        setResult(null);
        try {
          const res = await apiFetch('/api/mail/send', {
            method: 'POST',
            body: JSON.stringify({
              recipient_ids: recipients.map((r) => r.id),
              subject,
              body_template: bodyTemplate
            })
          });
          setResult(res);
          if (res.sent_count > 0) {
            showToast(`Wysłano ${res.sent_count} spersonalizowanych wiadomości przez SMTP!`);
          }
        } catch (err) {
          setResult({ sent_count: 0, failed_count: recipients.length, errors: [err.message] });
        } finally {
          setSending(false);
        }
      };

      const handleOutlookFallback = async () => {
        const emails = recipients.map((r) => r.email).filter(Boolean);
        if (emails.length === 0) {
          showToast('Brak adresów email na liście odbiorców.', 'error');
          return;
        }
        const bccString = emails.join(';');
        try {
          await navigator.clipboard.writeText(bccString);
          showToast(`Skopiowano ${emails.length} adresów do schowka i otwarto Outlooka (BCC)!`);
        } catch (_) {
          showToast(`Otwieranie Outlooka dla ${emails.length} odbiorców w BCC.`);
        }
        const cleanBody = bodyTemplate
          .replaceAll('{imie}', 'Studenci')
          .replaceAll('{grupa}', selectedGroup === 'ALL' ? 'wszystkie grupy' : selectedGroup);
        const mailtoUrl = `mailto:?bcc=${encodeURIComponent(emails.join(','))}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(cleanBody)}`;
        window.location.href = mailtoUrl;
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-sm p-4 overflow-y-auto">
          <div className="w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
            <div className="px-6 py-4 bg-slate-950 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <Icon name="mail" className="w-5 h-5 text-blue-400" />
                <div>
                  <h3 className="text-base font-bold text-white">Moduł Poczty (Office 365 SMTP & 1-Click Outlook BCC)</h3>
                  <p className="text-xs text-slate-400">
                    Wybrano odbiorców: <strong className="text-blue-400">{recipients.length} studentów</strong>
                  </p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1">
                <Icon name="close" className="w-5 h-5" />
              </button>
            </div>

            <div className="p-6 space-y-5 max-h-[82vh] overflow-y-auto">
              <div className={`p-3.5 rounded-xl border text-xs flex flex-wrap items-center justify-between gap-2 ${
                mailConfig?.is_configured
                  ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300'
                  : 'bg-amber-500/10 border-amber-500/30 text-amber-300'
              }`}>
                <div>
                  <span className="font-semibold">Serwer SMTP ({mailConfig?.smtp_host}:{mailConfig?.smtp_port}): </span>
                  {mailConfig?.is_configured
                    ? `Aktywny (${mailConfig.smtp_user})`
                    : 'Brak poświadczeń SMTP w pliku .env — użyj trybu 1-Click Outlook (BCC) lub skonfiguruj .env'}
                </div>
                <button
                  type="button"
                  onClick={handleOutlookFallback}
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold transition shadow"
                >
                  <Icon name="send" className="w-3.5 h-3.5" />
                  <span>Otwórz w Outlook (1-Click BCC + Kopiuj adresy)</span>
                </button>
              </div>

              <form onSubmit={handleSmtpSend} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
                    Temat wiadomości (obsługuje zmienne &#123;imie&#125;, &#123;grupa&#125;)
                  </label>
                  <input
                    type="text"
                    required
                    value={subject}
                    onChange={(e) => setSubject(e.target.value)}
                    className="w-full px-3.5 py-2 rounded-lg bg-slate-950 border border-slate-700 text-sm text-white"
                  />
                </div>

                <div>
                  <div className="flex items-center justify-between mb-1">
                    <label className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                      Szablon treści wiadomości
                    </label>
                    <span className="text-[11px] text-slate-400">
                      Dostępne zmienne: <code className="text-blue-400">&#123;imie&#125;</code>, <code className="text-blue-400">&#123;nazwisko&#125;</code>, <code className="text-blue-400">&#123;grupa&#125;</code>, <code className="text-blue-400">&#123;komentarz&#125;</code>
                    </span>
                  </div>
                  <textarea
                    rows="5"
                    required
                    value={bodyTemplate}
                    onChange={(e) => setBodyTemplate(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-lg bg-slate-950 border border-slate-700 text-sm text-white font-mono"
                  />
                </div>

                <div className="p-3.5 rounded-xl bg-slate-950/90 border border-slate-800">
                  <div className="text-[11px] uppercase tracking-wider text-slate-500 font-semibold mb-1.5">
                    Podgląd personalizacji dla: {sampleStudent.imie} {sampleStudent.nazwisko} ({sampleStudent.email})
                  </div>
                  <div className="text-xs font-semibold text-slate-200 mb-1">
                    Temat: {renderPreview(subject)}
                  </div>
                  <pre className="text-xs text-slate-400 whitespace-pre-wrap font-sans">
                    {renderPreview(bodyTemplate)}
                  </pre>
                </div>

                {result && (
                  <div className={`p-3.5 rounded-xl border text-xs ${
                    result.failed_count === 0
                      ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300'
                      : 'bg-rose-500/15 border-rose-500/40 text-rose-300'
                  }`}>
                    <p className="font-semibold">
                      Wysłano pomyślnie: {result.sent_count} | Błędy: {result.failed_count}
                    </p>
                    {result.errors?.length > 0 && (
                      <ul className="mt-1.5 list-disc list-inside space-y-0.5">
                        {result.errors.map((err, i) => <li key={i}>{err}</li>)}
                      </ul>
                    )}
                  </div>
                )}

                <div className="flex flex-wrap items-center justify-end gap-3 pt-2 border-t border-slate-800">
                  <button
                    type="button"
                    onClick={onClose}
                    className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-300"
                  >
                    Zamknij
                  </button>
                  <button
                    type="button"
                    onClick={handleOutlookFallback}
                    className="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg bg-indigo-600/90 hover:bg-indigo-500 text-xs font-semibold text-white"
                  >
                    <Icon name="mail" className="w-3.5 h-3.5" />
                    <span>Kopiuj BCC i otwórz Outlook</span>
                  </button>
                  <button
                    type="submit"
                    disabled={sending || recipients.length === 0}
                    className="inline-flex items-center gap-1.5 px-5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-xs font-semibold text-white shadow-lg shadow-emerald-600/20"
                  >
                    <Icon name="send" className="w-3.5 h-3.5" />
                    <span>{sending ? 'Wysyłanie przez SMTP...' : `Wyślij spersonalizowane maile SMTP (${recipients.length})`}</span>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      );
    }

    // ==================== GŁÓWNA APLIKACJA DASHBOARDU ====================
    function App() {
      const [user, setUser] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      const [activeTab, setActiveTab] = useState('dashboard'); // dashboard | calendar | students | rau2 | users
      const [toast, setToast] = useState(null);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);

      // Dane aplikacyjne
      const [students, setStudents] = useState([]);
      const [groups, setGroups] = useState([]);
      const [selectedGroup, setSelectedGroup] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedStudentIds, setSelectedStudentIds] = useState([]);

      // Inne moduły
      const [courses, setCourses] = useState([]);
      const [feeds, setFeeds] = useState([]);
      const [events, setEvents] = useState([]);
      const [announcements, setAnnouncements] = useState([]);
      const [usersList, setUsersList] = useState([]);
      const [mailConfig, setMailConfig] = useState(null);
      const [isMailModalOpen, setIsMailModalOpen] = useState(false);

      // Stany formularzy (Dodawanie studenta, Ukrywany pasek Importu Excela, Akcje masowe)
      const [newStudent, setNewStudent] = useState({ imie: '', nazwisko: '', email: '', grupa: '1', komentarz: '' });
      const [showAddStudentForm, setShowAddStudentForm] = useState(false);
      const [showExcelDropzone, setShowExcelDropzone] = useState(() => {
        return localStorage.getItem('starosta_hide_excel_dropzone') !== 'true';
      });
      const [importReport, setImportReport] = useState(null);
      const [isDraggingFile, setIsDraggingFile] = useState(false);
      const [bulkAction, setBulkAction] = useState('SET_GROUP');
      const [bulkValue, setBulkValue] = useState('');

      const canEdit = user && (user.role === 'ADMIN' || user.role === 'GROUP_LEADER');
      const isAdmin = user && user.role === 'ADMIN';

      const toggleExcelDropzone = (visible) => {
        setShowExcelDropzone(visible);
        localStorage.setItem('starosta_hide_excel_dropzone', visible ? 'false' : 'true');
      };

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4500);
      };

      useEffect(() => {
        apiFetch('/api/auth/me')
          .then((u) => setUser(u))
          .catch(() => setUser(null))
          .finally(() => setAuthChecked(true));
      }, []);

      const loadAllData = async () => {
        if (!user) return;
        try {
          const [stuData, grpData, crsData, feedData, evData, annData, mailCfg] = await Promise.all([
            apiFetch(`/api/students?grupa=${encodeURIComponent(selectedGroup)}&search=${encodeURIComponent(searchQuery)}`),
            apiFetch('/api/students/groups'),
            apiFetch('/api/courses'),
            apiFetch('/api/calendar/feeds'),
            apiFetch('/api/calendar/events'),
            apiFetch('/api/announcements'),
            apiFetch('/api/mail/config')
          ]);
          setStudents(stuData);
          setGroups(grpData);
          setCourses(crsData);
          setFeeds(feedData);
          setEvents(evData);
          setAnnouncements(annData);
          setMailConfig(mailCfg);

          if (user.role === 'ADMIN') {
            const uList = await apiFetch('/api/users');
            setUsersList(uList);
          }
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      useEffect(() => {
        if (user) {
          loadAllData();
        }
      }, [user]);

      const fetchStudents = async (grp = selectedGroup, srch = searchQuery) => {
        if (!user) return;
        try {
          const [stuData, grpData] = await Promise.all([
            apiFetch(`/api/students?grupa=${encodeURIComponent(grp)}&search=${encodeURIComponent(srch)}`),
            apiFetch('/api/students/groups')
          ]);
          setStudents(stuData);
          setGroups(grpData);
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      useEffect(() => {
        if (user) {
          const timer = setTimeout(() => fetchStudents(selectedGroup, searchQuery), 150);
          return () => clearTimeout(timer);
        }
      }, [selectedGroup, searchQuery]);

      const handleLogout = async () => {
        await apiFetch('/api/auth/logout', { method: 'POST' });
        setUser(null);
      };

      // Wyłącznie ważne terminy (Kolokwia, Egzaminy, Deadline'y RAU2) - bez wykładów, laboratoriów i lektoratów
      const timelineEventsOnly = useMemo(() => {
        return events.filter((ev) => !CLASS_CATEGORIES.includes(ev.category));
      }, [events]);

      // ==================== OBSŁUGA STUDENTÓW & INLINE EDIT ====================
      const handleCreateStudent = async (e) => {
        e.preventDefault();
        try {
          await apiFetch('/api/students', {
            method: 'POST',
            body: JSON.stringify(newStudent)
          });
          setNewStudent({ imie: '', nazwisko: '', email: '', grupa: '1', komentarz: '' });
          setShowAddStudentForm(false);
          showToast('Dodano nowego studenta do bazy.');
          fetchStudents();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleInlineUpdate = async (studentId, field, value) => {
        const current = students.find((s) => s.id === studentId);
        if (!current || current[field] === value) return;
        try {
          const updated = await apiFetch(`/api/students/${studentId}`, {
            method: 'PATCH',
            body: JSON.stringify({ [field]: value })
          });
          setStudents((prev) => prev.map((s) => (s.id === studentId ? updated : s)));
          if (field === 'grupa') {
            const grpData = await apiFetch('/api/students/groups');
            setGroups(grpData);
          }
          showToast(`Zaktualizowano pole "${field}" dla ${updated.imie} ${updated.nazwisko}`);
        } catch (err) {
          showToast(err.message, 'error');
          fetchStudents();
        }
      };

      const handleDeleteStudent = async (studentId) => {
        if (!window.confirm('Czy na pewno chcesz usunąć tego studenta z bazy?')) return;
        try {
          await apiFetch(`/api/students/${studentId}`, { method: 'DELETE' });
          setStudents((prev) => prev.filter((s) => s.id !== studentId));
          setSelectedStudentIds((prev) => prev.filter((id) => id !== studentId));
          showToast('Usunięto studenta.');
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleFileUpload = async (file) => {
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);
        try {
          const res = await apiFetch('/api/students/import', {
            method: 'POST',
            body: formData
          });
          setImportReport(res);
          showToast(`Import zakończony! Dodano: ${res.inserted}, Zaktualizowano: ${res.updated}`);
          fetchStudents();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleBulkExecute = async (e) => {
        e.preventDefault();
        if (selectedStudentIds.length === 0) {
          showToast('Zaznacz najpierw studentów w tabeli.', 'error');
          return;
        }
        if (bulkAction === 'DELETE' && !window.confirm(`Usunąć zaznaczonych studentów (${selectedStudentIds.length})?`)) {
          return;
        }
        try {
          const res = await apiFetch('/api/students/bulk', {
            method: 'POST',
            body: JSON.stringify({
              student_ids: selectedStudentIds,
              action: bulkAction,
              value: bulkValue
            })
          });
          showToast(`Wykonano akcję masową dla ${res.affected} studentów.`);
          setSelectedStudentIds([]);
          setBulkValue('');
          fetchStudents();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const triggerQuickOutlookBCC = async () => {
        const targetList = selectedStudentIds.length > 0
          ? students.filter((s) => selectedStudentIds.includes(s.id))
          : students;

        const emails = targetList.map((s) => s.email).filter(Boolean);
        if (emails.length === 0) {
          showToast('Brak studentów na liście do wygenerowania BCC.', 'error');
          return;
        }
        try {
          await navigator.clipboard.writeText(emails.join(';'));
          showToast(`Skopiowano ${emails.length} adresów do schowka i otwarto Outlook (BCC)!`);
        } catch (_) {}
        window.location.href = `mailto:?bcc=${encodeURIComponent(emails.join(','))}&subject=${encodeURIComponent('[RAU2] Informacja od Starosty Roku')}`;
      };

      const mailRecipients = useMemo(() => {
        if (selectedStudentIds.length > 0) {
          return students.filter((s) => selectedStudentIds.includes(s.id));
        }
        return students;
      }, [students, selectedStudentIds]);

      if (!authChecked) {
        return (
          <div className="min-h-screen flex items-center justify-center text-slate-400 text-sm">
            Ładowanie Starosta Hub (RAU2)...
          </div>
        );
      }

      if (!user) {
        return <LoginView onLoginSuccess={(u) => setUser(u)} />;
      }

      const allGroupsList = Array.from(new Set(['1', '2', '3', ...groups]));

      return (
        <div className="min-h-screen flex flex-col bg-slate950 text-slate-100">
          {/* POWIADOMIENIE TOAST */}
          {toast && (
            <div className={`fixed bottom-5 right-5 z-50 px-4 py-3 rounded-xl shadow-2xl border text-xs font-semibold flex items-center gap-2.5 transition-all ${
              toast.type === 'error'
                ? 'bg-rose-950/95 border-rose-500/50 text-rose-200'
                : 'bg-slate-900/95 border-blue-500/50 text-blue-200'
            }`}>
              <Icon name={toast.type === 'error' ? 'alert' : 'check'} className="w-4 h-4 shrink-0" />
              <span>{toast.message}</span>
            </div>
          )}

          {/* GÓRNY PASEK NAWIGACYJNY */}
          <header className="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-6 py-3.5">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center font-bold text-sm shadow-md shadow-blue-600/30">
                  RAU2
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-base text-white">Starosta Hub</span>
                    <span className="text-[11px] px-2 py-0.5 rounded bg-blue-500/15 text-blue-400 border border-blue-500/30 font-medium">
                      Politechnika Śląska • AEiI
                    </span>
                  </div>
                  <p className="text-xs text-slate-400">
                    Zalogowano jako: <strong className="text-slate-200">{user.full_name}</strong>
                  </p>
                </div>
              </div>

              {/* Nawigacja Zakładek (Z IKONAMI SVG) */}
              <nav className="flex flex-wrap items-center gap-1.5 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                    activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <Icon name="timeline" className="w-3.5 h-3.5" />
                  <span>Oś Czasu & Ogłoszenia</span>
                </button>
                <button
                  onClick={() => setActiveTab('calendar')}
                  className={`inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                    activeTab === 'calendar' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <Icon name="calendar" className="w-3.5 h-3.5" />
                  <span>Kalendarz Zajęć</span>
                </button>
                <button
                  onClick={() => setActiveTab('students')}
                  className={`inline-flex items-center gap-2 px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
                    activeTab === 'students' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-white'

                >
                  <Icon name="users" className="w-3.5 h-3.5" />

                </button>
                <button

                  <Icon name="book" className="w-3.5 h-3.5" />

                    <Icon name="shield" className="w-3.5 h-3.5" />
                    <span>Użytkownicy</span>
                  </button>
                )}
              </nav>

              {/* Profil Użytkownika ze Zdjęciem Profilowym */}
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setIsProfileModalOpen(true)}
                  className="flex items-center gap-2.5 pl-1.5 pr-3 py-1 rounded-full bg-slate-950 hover:bg-slate-800 border border-slate-800 transition group"
                  title="Kliknij, aby ustawić zdjęcie profilowe lub zmienić hasło"
                >
                  <div className="relative">
                    {user.avatar_url ? (
                      <img
                        src={user.avatar_url}
                        alt={user.full_name}
                        className="w-8 h-8 rounded-full object-cover border border-blue-500"
                      />
                    ) : (
                      <div className="w-8 h-8 rounded-full bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center text-xs font-bold text-white">
                        {getInitials(user.full_name)}
                      </div>
                    )}
                    <span className="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center text-blue-400">
                      <Icon name="camera" className="w-2.5 h-2.5" />
                    </span>

      const [komentarzVal, setKomentarzVal] = useState(student.komentarz || '');

      useEffect(() => {
        setGrupaVal(student.grupa);
        setKomentarzVal(student.komentarz || '');
      }, [student.grupa, student.komentarz]);

      return (
        <tr className={`hover:bg-slate-800/40 transition ${selected ? 'bg-blue-950/25' : ''}`}>
          <td className="p-3.5">
            <input
              type="checkbox"
              checked={selected}
              onChange={onToggleSelect}
              className="rounded bg-slate-900 border-slate-700"
            />
          </td>
          <td className="p-3.5 font-semibold text-white">
            {student.nazwisko} {student.imie}
          </td>
          <td className="p-3.5 text-slate-300 font-mono text-[11px]">
            <a href={`mailto:${student.email}`} className="hover:text-blue-400 underline decoration-slate-700">
              {student.email}
            </a>
          </td>
          <td className="p-3.5">
            {canEdit ? (
              <input
                type="text"
                value={grupaVal}
                onChange={(e) => setGrupaVal(e.target.value)}
                onBlur={() => onInlineUpdate(student.id, 'grupa', grupaVal)}
                onKeyDown={(e) => e.key === 'Enter' && e.target.blur()}
                className="w-24 px-2.5 py-1 rounded-lg bg-slate-950 border border-slate-700 focus:border-blue-500 focus:outline-none text-xs font-semibold text-blue-300"
              />

    // ==================== NOWA ZAKŁADKA: KALENDARZ ZAJĘĆ (ROZKŁAD PRZEDMIOTÓW Z USOS & RAU2) ====================
    function ScheduleCalendarView({ events, courses, allGroupsList, canEdit, onRefresh, showToast }) {
      const [viewMode, setViewMode] = useState('week'); // 'week' | 'month'
      const [referenceDate, setReferenceDate] = useState(() => new Date());
      const [groupFilter, setGroupFilter] = useState('ALL');
      const [typeFilter, setTypeFilter] = useState('ALL');
      const [showAddClassModal, setShowAddClassModal] = useState(false);
      const [newClass, setNewClass] = useState({
        title: '',
        category: 'WYKLAD',
        location: '',
        start_time: '',
        end_time: '',
        target_group: 'Wszystkie',
        description: ''
      });

      // Wyznaczanie poniedziałku aktualnie wybranego tygodnia
      const startOfWeek = useMemo(() => {
        const d = new Date(referenceDate);
        const day = d.getDay();
        const diff = d.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(d.setDate(diff));
        monday.setHours(0, 0, 0, 0);
        return monday;
      }, [referenceDate]);

      const weekDays = useMemo(() => {
        const days = [];
        const labels = ['Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota', 'Niedziela'];
        for (let i = 0; i < 7; i++) {
          const dt = new Date(startOfWeek);
          dt.setDate(startOfWeek.getDate() + i);
          days.push({ date: dt, label: labels[i] });
        }
        return days;
      }, [startOfWeek]);

      // Dni do siatki miesięcznej
      const monthDays = useMemo(() => {
        const year = referenceDate.getFullYear();
        const month = referenceDate.getMonth();
        const firstDayOfMonth = new Date(year, month, 1);
        const lastDayOfMonth = new Date(year, month + 1, 0);

        const startOffset = (firstDayOfMonth.getDay() + 6) % 7; // Poniedziałek = 0
        const gridStart = new Date(firstDayOfMonth);
        gridStart.setDate(firstDayOfMonth.getDate() - startOffset);

        const cells = [];
        for (let i = 0; i < 42; i++) {
          const d = new Date(gridStart);
          d.setDate(gridStart.getDate() + i);
          cells.push({
            date: d,
            isCurrentMonth: d.getMonth() === month
          });
        }
        return cells;
      }, [referenceDate]);

      const filteredScheduleEvents = useMemo(() => {
        return events.filter((ev) => {
          if (groupFilter !== 'ALL' && ev.target_group !== 'Wszystkie' && ev.target_group !== groupFilter) {
            return false;
          }
          if (typeFilter !== 'ALL' && ev.category !== typeFilter) {
            return false;
          }
          return true;
        });
      }, [events, groupFilter, typeFilter]);

      const navigatePeriod = (direction) => {
        const next = new Date(referenceDate);
        if (viewMode === 'week') {
          next.setDate(next.getDate() + direction * 7);
        } else {
          next.setMonth(next.getMonth() + direction);
        }
        setReferenceDate(next);
      };

      const isSameDay = (d1, d2) =>
        d1.getFullYear() === d2.getFullYear() &&
        d1.getMonth() === d2.getMonth() &&
        d1.getDate() === d2.getDate();

      const getCardStyle = (category) => {
        const styles = {
          WYKLAD: 'bg-sky-500/15 border-sky-500/40 text-sky-200',
          LAB: 'bg-emerald-500/15 border-emerald-500/40 text-emerald-200',
          LEKTORAT: 'bg-teal-500/15 border-teal-500/40 text-teal-200',
          CWICZENIA: 'bg-cyan-500/15 border-cyan-500/40 text-cyan-200',
          PROJEKT: 'bg-indigo-500/15 border-indigo-500/40 text-indigo-200',
          KOLOKWIUM: 'bg-amber-500/20 border-amber-500/50 text-amber-200',
          EGZAMIN: 'bg-rose-500/20 border-rose-500/50 text-rose-200',
          DEADLINE_RAU2: 'bg-purple-500/20 border-purple-500/50 text-purple-200'
        };
        return styles[category] || 'bg-slate-800 border-slate-700 text-slate-200';
      };

      const handleCreateClassEvent = async (e) => {
        e.preventDefault();
        try {
          await apiFetch('/api/calendar/events', {
            method: 'POST',
            body: JSON.stringify({
              ...newClass,
              start_time: new Date(newClass.start_time).toISOString(),
              end_time: newClass.end_time ? new Date(newClass.end_time).toISOString() : null,
              source_label: 'Plan USOS / RAU2'
            })
          });
          setShowAddClassModal(false);
          setNewClass({
            title: '', category: 'WYKLAD', location: '', start_time: '', end_time: '', target_group: 'Wszystkie', description: ''
          });
          showToast('Dodano zajęcia do siatki kalendarza.');
          onRefresh();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      return (
        <section className="space-y-5">
          {/* Pasek sterowania kalendarzem */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div>
                <h2 className="text-lg font-bold text-white flex items-center gap-2">
                  <Icon name="calendar" className="w-5 h-5 text-blue-400" />
                  <span>Kalendarz Zajęć i Przedmiotów (USOSweb & RAU2)</span>
                </h2>
                <p className="text-xs text-slate-400">
                  Rozkład wykładów, laboratoriów, lektoratów, projektów oraz terminów zaliczeń pobranych z plików .ics USOSweb.
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-2">
                {/* Przełącznik Tydzień / Miesiąc */}
                <div className="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
                  <button
                    onClick={() => setViewMode('week')}
                    className={`px-3 py-1.5 rounded-lg transition ${
                      viewMode === 'week' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    Widok Tygodniowy
                  </button>
                  <button
                    onClick={() => setViewMode('month')}
                    className={`px-3 py-1.5 rounded-lg transition ${
                      viewMode === 'month' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    Widok Miesięczny
                  </button>
                </div>

                {/* Nawigacja dat */}
                <div className="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
                  <button
                    onClick={() => navigatePeriod(-1)}
                    className="p-1.5 rounded-lg hover:bg-slate-800 text-slate-300"
                    title="Poprzedni okres"
                  >
                    <Icon name="chevronLeft" className="w-4 h-4" />
                  </button>
                  <button
                    onClick={() => setReferenceDate(new Date())}
                    className="px-3 py-1 text-xs font-semibold text-slate-200 hover:text-white"
                  >
                    Dzisiaj
                  </button>
                  <button
                    onClick={() => navigatePeriod(1)}
                    className="p-1.5 rounded-lg hover:bg-slate-800 text-slate-300"
                    title="Następny okres"
                  >
                    <Icon name="chevronRight" className="w-4 h-4" />
                  </button>

                                  <span className="truncate">{ev.location}</span>

                                Grupa: {ev.target_group}

                <div>Pon</div><div>Wt</div><div>Śr</div><div>Czw</div><div>Pt</div><div>Sob</div><div>Ndz</div>
              </div>

              <div className="grid grid-cols-7 divide-x divide-y divide-slate-800">
                {monthDays.map((cell, i) => {
                  const dayEvents = filteredScheduleEvents.filter((ev) =>
                    isSameDay(new Date(ev.start_time), cell.date)
                  );
                  const isToday = isSameDay(cell.date, new Date());

                  return (
                    <div
                      key={i}
                      className={`min-h-[115px] p-2 flex flex-col gap-1 ${
                        cell.isCurrentMonth ? 'bg-slate-900' : 'bg-slate-950/60 opacity-50'
                      } ${isToday ? 'ring-1 ring-inset ring-blue-500 bg-blue-950/20' : ''}`}

                      <div className="flex items-center justify-between text-xs font-bold">
                        <span className={isToday ? 'text-blue-400' : 'text-slate-300'}>
                          {cell.date.getDate()}

                          <span className="text-[10px] px-1.5 rounded bg-slate-800 text-slate-400">
                            {dayEvents.length}
                          </span>
                        )}
                      </div>
                      <div className="space-y-1 overflow-y-auto max-h-24 pr-0.5">
                        {dayEvents.map((ev) => (
                          <div
                            key={ev.id}
                            className={`px-1.5 py-1 rounded border text-[10px] truncate ${getCardStyle(ev.category)}`}
                            title={`${formatTimeShort(ev.start_time)} ${ev.title} (${ev.location})`}

                            <span className="font-mono font-semibold mr-1">{formatTimeShort(ev.start_time)}</span>
                            <span>{ev.title}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </section>
      );

    // ==================== MODUŁ KATALOGU PRZEDMIOTÓW RAU2 & SUBSKRYPCJI .ICS ====================
    function Rau2AndCalendarModule({ courses, feeds, canEdit, onRefresh, showToast }) {
      const [newCourse, setNewCourse] = useState({
        code: '', name: '', lecturer: '', rau2_url: 'https://platforma.polsl.pl/rau2/course/view.php?id=',
        usos_url: '', passing_rules: '', assigned_groups: 'Wszystkie', ects: 4
      });
      const [showCourseForm, setShowCourseForm] = useState(false);

      const [newFeed, setNewFeed] = useState({
        name: '', source_type: 'RAU2_MOODLE', ics_url: '', target_group: 'Wszystkie'
      });
      const [syncing, setSyncing] = useState(false);

      const handleAddCourse = async (e) => {
        e.preventDefault();
        try {
          await apiFetch('/api/courses', {
            method: 'POST',
            body: JSON.stringify(newCourse)
          });
          setShowCourseForm(false);
          setNewCourse({
            code: '', name: '', lecturer: '', rau2_url: 'https://platforma.polsl.pl/rau2/course/view.php?id=',
            usos_url: '', passing_rules: '', assigned_groups: 'Wszystkie', ects: 4
          });
          showToast('Dodano przedmiot do katalogu RAU2 & USOS.');
          onRefresh();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleAddFeed = async (e) => {
        e.preventDefault();
        try {
          await apiFetch('/api/calendar/feeds', {
            method: 'POST',
            body: JSON.stringify(newFeed)
          });
          setNewFeed({ name: '', source_type: 'RAU2_MOODLE', ics_url: '', target_group: 'Wszystkie' });
          showToast('Dodano i zsynchronizowano subskrypcję kalendarza .ics!');
          onRefresh();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleUploadIcsFile = async (file) => {
        if (!file) return;
        const formData = new FormData();
        formData.append('file', file);
        try {
          const res = await apiFetch(`/api/calendar/feeds/upload-ics?name=${encodeURIComponent(file.name)}&source_type=USOS`, {
            method: 'POST',
            body: formData
          });
          showToast(res.message);
          onRefresh();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleSyncAll = async () => {
        setSyncing(true);
        try {
          const res = await apiFetch('/api/calendar/sync', { method: 'POST' });
          showToast(`Zsynchronizowano ${res.synced_feeds} kalendarzy (${res.total_events} wydarzeń).`);
          onRefresh();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          setSyncing(false);
        }
      };

      return (
        <div className="space-y-6">
          {/* Katalog Przedmiotów RAU2 & USOSweb */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">

                </p>
              </div>
              {canEdit && (
                <button
                  onClick={() => setShowCourseForm(!showCourseForm)}
                  className="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white"
                >
                  <Icon name="plus" className="w-3.5 h-3.5" />
                  <span>Dodaj Przedmiot RAU2</span>
                </button>

            </div>

            {showCourseForm && canEdit && (

                  type="text"
                  required
                  placeholder="Kod przedmiotu (np. RAU2-SI)"
                  value={newCourse.code}

                  required

                  onChange={(e) => setNewCourse({ ...newCourse, name: e.target.value })}

                />
                <input

                <input

                <input

                <div className="flex items-center gap-2">

                  <button type="submit" className="px-4 py-2 rounded-lg bg-emerald-600 text-white font-semibold">
                    Zapisz

                        {c.code} • {c.ects} ECTS
                      </span>
                      {canEdit && (
                        <button
                          onClick={async () => {
                            await apiFetch(`/api/courses/${c.id}`, { method: 'DELETE' });
                            onRefresh();

                          className="text-slate-500 hover:text-rose-400 text-xs inline-flex items-center gap-1"

                          <Icon name="trash" className="w-3.5 h-3.5" />
                          <span>Usuń</span>
                        </button>

                    </div>
                    <h3 className="text-base font-bold text-white">{c.name}</h3>
                    <p className="text-xs text-slate-400 flex items-center gap-1.5">

                      <span>Prowadzący: <strong className="text-slate-200">{c.lecturer || '—'}</strong></span>
                    </p>
                    <p className="text-xs text-slate-400 flex items-center gap-1.5">
                      <Icon name="users" className="w-3.5 h-3.5 text-slate-500" />
                      <span>Grupy: {c.assigned_groups}</span>
                    </p>
                    {c.passing_rules && (

                  <div className="flex flex-wrap items-center gap-2 pt-3 border-t border-slate-800">
                    {c.rau2_url && (

                  <label className="cursor-pointer inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-200">

                    <span>Wgraj plik .ics z dysku</span>
                    <input

                  >
                    <Icon name="refresh" className="w-3.5 h-3.5" />
                    <span>{syncing ? 'Synchronizacja...' : 'Synchronizuj linki .ics'}</span>

                  required
                  placeholder="URL subskrypcji .ics (https://... lub webcal://...)"
                  value={newFeed.ics_url}
                  onChange={(e) => setNewFeed({ ...newFeed, ics_url: e.target.value })}
                  className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white sm:col-span-2"
                />
                <button type="submit" className="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold">
                  <Icon name="plus" className="w-3.5 h-3.5" />
                  <span>Podepnij Kalendarz</span>
                </button>
              </form>
            )}

            <div className="space-y-2">
              {feeds.length === 0 ? (
                <p className="text-xs text-slate-500 py-4 text-center">
                  Brak podpiętych zewnętrznych linków .ics. Dodaj link powyżej lub wgraj plik .ics.
                </p>
              ) : (
                feeds.map((f) => (
                  <div key={f.id} className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 flex flex-wrap items-center justify-between gap-3 text-xs">
                    <div>
                      <span className="font-bold text-white">{f.name}</span>
                      <span className="ml-2 px-2 py-0.5 rounded bg-slate-800 text-blue-300 text-[11px]">{f.source_type}</span>
                      <p className="text-[11px] text-slate-500 truncate max-w-xl mt-0.5">{f.ics_url}</p>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-[11px] text-slate-400">
                        Ostatnia synchr.: {formatDateTime(f.last_synced_at)}
                      </span>
                      {canEdit && (
                        <button
                          onClick={async () => {
                            await apiFetch(`/api/calendar/feeds/${f.id}`, { method: 'DELETE' });
                            onRefresh();
                          }}
                          className="inline-flex items-center gap-1 px-2.5 py-1 rounded bg-rose-500/15 text-rose-300 hover:bg-rose-500/30"
                        >
                          <Icon name="trash" className="w-3.5 h-3.5" />
                          <span>Usuń</span>
                        </button>
                      )}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==================== MODUŁ ZARZĄDZANIA UŻYTKOWNIKAMI (RBAC - TYLKO STAROSTA ROKU) ====================
    function UserManagementModule({ users, currentAdminId, onRefresh, showToast }) {
      const [newUser, setNewUser] = useState({
        email: '', full_name: '', password: '', role: 'GROUP_LEADER', assigned_group: '1'
      });
      const [resetPasswords, setResetPasswords] = useState({});

      const handleCreateUser = async (e) => {
        e.preventDefault();
        try {
          await apiFetch('/api/users', {
            method: 'POST',
            body: JSON.stringify(newUser)
          });
          setNewUser({ email: '', full_name: '', password: '', role: 'GROUP_LEADER', assigned_group: '1' });
          showToast('Utworzono nowe konto użytkownika.');
          onRefresh();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleRoleOrStatusChange = async (userId, patch) => {
        try {
          await apiFetch(`/api/users/${userId}`, {
            method: 'PATCH',
            body: JSON.stringify(patch)
          });
          showToast('Zaktualizowano uprawnienia użytkownika.');
          onRefresh();
        } catch (err) {
          showToast(err.message, 'error');
        }
      };

      const handleResetPassword = async (userId) => {
        const tempPass = resetPasswords[userId];
        if (!tempPass || tempPass.length < 6) {
          showToast('Hasło tymczasowe musi mieć co najmniej 6 znaków.', 'error');
          return;
        }
        await handleRoleOrStatusChange(userId, { temporary_password: tempPass });
        setResetPasswords({ ...resetPasswords, [userId]: '' });
      };

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
            <div>
              <h2 className="text-lg font-bold text-white">Zarządzanie Użytkownikami i Uprawnieniami (RBAC)</h2>
              <p className="text-xs text-slate-400">
                Moduł dostępny wyłącznie dla Głównego Administratora (Starosty Roku). Twórz konta dla starostów poszczególnych grup dziekańskich/laboratoryjnych i nadawaj im tymczasowe hasła.
              </p>
            </div>

            <form onSubmit={handleCreateUser} className="p-4 rounded-xl bg-slate-950 border border-slate-800 grid grid-cols-1 sm:grid-cols-6 gap-3 text-xs">
              <input
                type="text"
                required
                placeholder="Imię i Nazwisko (np. Starosta Grupy 2)"
                value={newUser.full_name}
                onChange={(e) => setNewUser({ ...newUser, full_name: e.target.value })}
                className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white"
              />
              <input
                type="email"
                required
                placeholder="Email (@student.polsl.pl)"
                value={newUser.email}
                onChange={(e) => setNewUser({ ...newUser, email: e.target.value })}
                className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white"
              />
              <input
                type="text"
                required
                minLength={6}
                placeholder="Tymczasowe hasło (min. 6 zn.)"
                value={newUser.password}
                onChange={(e) => setNewUser({ ...newUser, password: e.target.value })}
                className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white"
              />
              <select
                value={newUser.role}
                onChange={(e) => setNewUser({ ...newUser, role: e.target.value })}
                className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white"
              >
                <option value="GROUP_LEADER">GROUP_LEADER (Starosta Grupy)</option>
                <option value="VIEWER">VIEWER (Tylko odczyt)</option>
                <option value="ADMIN">ADMIN (Pełny dostęp)</option>
              </select>
              <input
                type="text"
                placeholder="Przypisana grupa (np. 2, Lab 1A)"
                value={newUser.assigned_group}
                onChange={(e) => setNewUser({ ...newUser, assigned_group: e.target.value })}
                className="px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-white"
              />
              <button type="submit" className="inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-bold text-white">
                <Icon name="plus" className="w-3.5 h-3.5" />
                <span>Utwórz Konto</span>
              </button>
            </form>

            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="bg-slate-950 border-b border-slate-800 text-[11px] uppercase text-slate-400">
                    <th className="p-3.5">Użytkownik</th>
                    <th className="p-3.5">Rola RBAC</th>
                    <th className="p-3.5">Grupa</th>
                    <th className="p-3.5">Status</th>
                    <th className="p-3.5">Reset Hasła Tymczasowego</th>
                    <th className="p-3.5 text-right">Akcje</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {users.map((u) => (
                    <tr key={u.id} className="hover:bg-slate-800/30">
                      <td className="p-3.5">
                        <div className="flex items-center gap-2.5">
                          {u.avatar_url ? (
                            <img src={u.avatar_url} alt={u.full_name} className="w-7 h-7 rounded-full object-cover border border-slate-700" />
                          ) : (
                            <div className="w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-[10px] font-bold text-slate-300">
                              {getInitials(u.full_name)}
                            </div>
                          )}
                          <div>
                            <div className="font-bold text-white">{u.full_name}</div>
                            <div className="text-slate-400 font-mono text-[11px]">{u.email}</div>
                          </div>
                        </div>
                      </td>
                      <td className="p-3.5">
                        <select
                          disabled={u.id === currentAdminId}
                          value={u.role}
                          onChange={(e) => handleRoleOrStatusChange(u.id, { role: e.target.value })}
                          className="px-2.5 py-1 rounded-lg bg-slate-950 border border-slate-700 text-white disabled:opacity-50"
                        >
                          <option value="ADMIN">ADMIN</option>
                          <option value="GROUP_LEADER">GROUP_LEADER</option>
                          <option value="VIEWER">VIEWER</option>
                        </select>
                      </td>
                      <td className="p-3.5 text-slate-300">{u.assigned_group || 'Wszystkie'}</td>
                      <td className="p-3.5">
                        <span className={`px-2 py-0.5 rounded-full text-[11px] font-semibold ${
                          u.is_active ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'
                        }`}>
                          {u.is_active ? 'Aktywne' : 'Zablokowane'}
                        </span>
                      </td>
                      <td className="p-3.5">
                        <div className="flex items-center gap-1.5">
                          <input
                            type="text"
                            placeholder="Nowe hasło tymczasowe..."
                            value={resetPasswords[u.id] || ''}
                            onChange={(e) => setResetPasswords({ ...resetPasswords, [u.id]: e.target.value })}
                            className="px-2.5 py-1 rounded bg-slate-950 border border-slate-700 text-white"
                          />
                          <button
                            type="button"
                            onClick={() => handleResetPassword(u.id)}
                            className="px-2.5 py-1 rounded bg-amber-600/80 hover:bg-amber-500 text-white font-semibold"
                          >
                            Nadaj
                          </button>
                        </div>
                      </td>
                      <td className="p-3.5 text-right space-x-2">
                        {u.id !== currentAdminId && (
                          <>
                            <button
                              onClick={() => handleRoleOrStatusChange(u.id, { is_active: !u.is_active })}
                              className="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-200"
                            >
                              {u.is_active ? 'Zablokuj' : 'Odblokuj'}
                            </button>
                            <button
                              onClick={async () => {
                                if (!window.confirm(`Usunąć konto ${u.email}?`)) return;
                                await apiFetch(`/api/users/${u.id}`, { method: 'DELETE' });
                                onRefresh();
                              }}
                              className="px-2.5 py-1 rounded bg-rose-500/20 hover:bg-rose-500/40 text-rose-300"
                            >
                              Usuń
                            </button>
                          </>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
